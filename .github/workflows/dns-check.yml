# Диагностика: как DNS loftmap.ru виден из сети GitHub (раннеры в Azure US).
name: dns-check
on: { workflow_dispatch: {} }
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== resolver of runner"; cat /etc/resolv.conf | grep nameserver
          echo "== system resolve"; dig +time=5 +tries=1 loftmap.ru A | grep -E 'status:|^loftmap'
          dig +time=5 +tries=1 loftmap.ru CAA | grep -E 'status:'
          for ns in ns1.reg.ru ns2.reg.ru; do
            echo "== direct $ns ($(dig +short $ns))"
            dig +time=5 +tries=1 @$ns loftmap.ru A | grep -E 'status:|^loftmap|timed out'
            dig +tcp +time=5 +tries=1 @$ns loftmap.ru A | grep -E 'status:|timed out'
            dig +time=5 +tries=1 @$ns loftmap.ru CAA | grep -E 'status:|timed out'
          done
          echo "== 8.8.8.8"; dig +time=5 +tries=1 @8.8.8.8 loftmap.ru A | grep -E 'status:'
          echo "== ripn"; dig +time=5 +tries=1 @a.dns.ripn.net loftmap.ru NS | grep -E 'status:|NS'
          echo "== https"; curl -sv --max-time 15 https://loftmap.ru/ -o /dev/null 2>&1 | grep -iE 'subject:|SSL|error' | head -3
